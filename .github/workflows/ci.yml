name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast-suite:
    # Typecheck + the fast vitest suite (pure units + mocked HTTP/orchestration).
    # No secrets, no database, no chain — integration tests (Neon branch) and the
    # money-moving live spikes run only on developer machines.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test

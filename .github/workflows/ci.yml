name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast-suite:
    # Typecheck + the fast vitest suite (pure units + mocked HTTP/orchestration).
    # No secrets, no database, no chain — integration tests (Neon branch) and the
    # money-moving live spikes run only on developer machines.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test

  agent-suite:
    # Phase 5: the Python agent's offline unit tests (no LLM, no network, no money).
    # The pinned SDK list lives in agent/requirements.txt; the env check proves the
    # keyless path (the scripted LLM fallback) is what CI exercises.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r agent/requirements.txt
      - run: pip install -e agent
      - working-directory: agent
        run: pytest -q
